alias: q_intro_off_connection
label: Team connection
name: "How connected do you feel to the rest of the team right now?"
description: "Probes isolation or drift without naming it; one of the earliest signals of disengagement."
purpose: wellbeing
stage: observation
axis_effects:
  engagement: +3
  wellbeing: +1
source: seed
hints:
  - kind: ask
    text: Ask about now, not in general. The word right now is doing the work.
  - kind: listen
    text: Whether they talk about people or about being in the loop.
  - kind: listen
    text: Whether they name a change point, or say it has always been like this.
