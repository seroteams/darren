alias: q_intro_perf_01_opening
label: Self-read opener
name: "Before I share my view, how do you think the last stretch has gone?"
description: "Anchors the conversation in their self-assessment first; gap vs manager's view becomes a signal."
purpose: topic
stage: self_read
axis_effects:
  clarity: +3
  engagement: +1
source: seed
hints:
  - kind: ask
    text: Ask it first and mean it. Sharing your view early closes the answer down.
  - kind: listen
    text: Whether their read is close to yours, and where it separates.
  - kind: listen
    text: Whether they self-assess with examples or with adjectives.
