alias: q_intro_growth_blockers
label: Growth blockers
name: "What's in your way of getting to the next level — not what's missing, what's actively blocking?"
description: "Forces specificity about obstacles rather than vague 'more opportunities please'."
purpose: topic
stage: gap
axis_effects:
  growth: +3
  clarity: +1
source: seed
hints:
  - kind: ask
    text: Hold the distinction. If they name a gap, ask what is blocking instead.
  - kind: listen
    text: Whether the blocker is something you control, or something they do.
  - kind: listen
    text: Whether they name one real obstacle or a general shortage of time.
