alias: q_safe_calls_4
label: Safe calls
name: When you played it safe, what did you choose not to push on?
description: Turns his own example into a specific gap in principal-level influence and decision-making.
purpose: topic
stage: evidence
axis_effects:
  growth: +1
source: planner_added
hints:
  - kind: ask
    text: Ask for one decision or discussion he held back on.
